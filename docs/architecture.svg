<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="780" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Voice Booking Agent — Architecture (happy path)</text>

  <!-- agent.py container -->
  <rect x="165" y="50" width="590" height="400" rx="12" fill="#fafafa" stroke="#666" stroke-dasharray="6 4"/>
  <text x="180" y="72" font-size="13" font-weight="bold" fill="#333">agent.py  ·  LiveKit Agents framework</text>
  <text x="180" y="89" font-size="11" fill="#555">AgentSession orchestrates every step: streaming, turn-taking, tool calls, playback</text>

  <!-- Caller -->
  <rect x="20" y="215" width="120" height="100" rx="10" fill="#FFF3E0" stroke="#E65100"/>
  <text x="80" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Caller</text>
  <text x="80" y="270" text-anchor="middle" font-size="11" fill="#444">laptop mic</text>
  <text x="80" y="285" text-anchor="middle" font-size="11" fill="#444">&amp; speakers</text>

  <!-- VAD (local) -->
  <rect x="190" y="110" width="140" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="260" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Silero VAD</text>
  <text x="260" y="156" text-anchor="middle" font-size="10.5" fill="#444">detects speech /</text>
  <text x="260" y="169" text-anchor="middle" font-size="10.5" fill="#444">end of turn</text>

  <!-- STT (external) -->
  <rect x="380" y="110" width="150" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="455" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">STT</text>
  <text x="455" y="152" text-anchor="middle" font-size="10.5" fill="#444">Deepgram (current)</text>
  <text x="455" y="167" text-anchor="middle" font-size="10.5" fill="#444">Gnani Prisma (switchable)</text>

  <!-- LLM (external) -->
  <rect x="580" y="110" width="155" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="657" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">LLM</text>
  <text x="657" y="152" text-anchor="middle" font-size="10.5" fill="#444">Groq (current)</text>
  <text x="657" y="167" text-anchor="middle" font-size="10.5" fill="#444">Gnani Evon (switchable)</text>

  <!-- Tool (local) -->
  <rect x="580" y="240" width="155" height="55" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="657" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">book_slot tool</text>
  <text x="657" y="281" text-anchor="middle" font-size="10.5" fill="#444">in agent.py</text>

  <!-- Calendar (local) -->
  <rect x="580" y="355" width="155" height="60" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="657" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Calendar store</text>
  <text x="657" y="398" text-anchor="middle" font-size="10.5" fill="#444">slots.json + bookings.json</text>

  <!-- TTS (external) -->
  <rect x="380" y="350" width="150" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="455" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">TTS</text>
  <text x="455" y="392" text-anchor="middle" font-size="10.5" fill="#444">Deepgram (current)</text>
  <text x="455" y="407" text-anchor="middle" font-size="10.5" fill="#444">Gnani Timbre (switchable)</text>

  <!-- Arrows -->
  <!-- 1 caller -> VAD -->
  <path d="M140 245 L165 245 L165 145 L188 145" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="172" y="205" font-size="11" fill="#E65100" font-weight="bold">1</text>
  <text x="172" y="218" font-size="10" fill="#333">audio</text>

  <!-- 2 VAD -> STT -->
  <path d="M330 145 L378 145" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="354" y="137" text-anchor="middle" font-size="10" fill="#333">speech</text>

  <!-- 3 STT -> LLM -->
  <path d="M530 145 L578 145" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="554" y="128" text-anchor="middle" font-size="11" fill="#E65100" font-weight="bold">2</text>
  <text x="554" y="139" text-anchor="middle" font-size="10" fill="#333">text</text>

  <!-- 4 LLM -> tool -->
  <path d="M640 180 L640 238" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="634" y="207" text-anchor="end" font-size="11" fill="#E65100" font-weight="bold">3</text>
  <text x="634" y="220" text-anchor="end" font-size="10" fill="#333">call(date)</text>

  <!-- 5 tool -> LLM (result) -->
  <path d="M675 240 L675 182" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="681" y="207" font-size="11" fill="#E65100" font-weight="bold">5</text>
  <text x="681" y="220" font-size="10" fill="#333">result</text>

  <!-- 4b tool -> calendar -->
  <path d="M657 295 L657 353" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="664" y="320" font-size="11" fill="#E65100" font-weight="bold">4</text>
  <text x="664" y="333" font-size="10" fill="#333">allot + save</text>

  <!-- 6 LLM -> TTS -->
  <path d="M595 180 L595 205 L480 205 L480 348" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="487" y="280" font-size="11" fill="#E65100" font-weight="bold">6</text>
  <text x="487" y="293" font-size="10" fill="#333">reply text</text>

  <!-- 7 TTS -> caller -->
  <path d="M380 385 L165 385 L165 285 L142 285" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="240" y="378" font-size="11" fill="#E65100" font-weight="bold">7</text>
  <text x="255" y="378" font-size="10" fill="#333">audio</text>

  <!-- Legend -->
  <rect x="20" y="470" width="16" height="12" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="42" y="480" font-size="11" fill="#333">Runs locally on your laptop (no key)</text>
  <rect x="270" y="470" width="16" height="12" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="292" y="480" font-size="11" fill="#333">External API (needs a key) — swappable via .env</text>
  <text x="20" y="505" font-size="11" fill="#555">Console mode: mic/speakers connect directly to agent.py. In dev mode, audio travels via a LiveKit room</text>
  <text x="20" y="520" font-size="11" fill="#555">(browser to LiveKit server to agent.py, and back); everything inside the dashed box stays the same.</text>
</svg>
